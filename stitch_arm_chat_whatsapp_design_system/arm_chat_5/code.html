      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

    .fill-icon {

    }
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #000000; /* Strictly flat dark mode for call context */
    }
    .video-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      height: calc(100vh - 120px);
      padding: 24px;
    }
    .pip-window {
      position: absolute;
      bottom: 100px;
      right: 24px;
      width: 240px;
      aspect-ratio: 16/9;
      z-index: 30;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    /* Layout Gap Rule: 80px gaps for major sections */
    .call-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
  </style>

<div class="absolute bottom-md left-md bg-black/60 backdrop-blur-sm px-md py-xs rounded-full flex items-center gap-sm">

<!-- Control Bar (Pill Shape) -->

<!-- Mic Toggle -->
<button class="w-14 h-14 rounded-full border border-white/20 flex items-center justify-center bg-white/5 hover:bg-white/10 transition-all group" id="toggleMic" onclick="toggleControl('toggleMic', 'mic', 'mic_off')">
<span class="material-symbols-outlined text-white group-active:scale-90 transition-transform">mic</span>
</button>
<!-- Camera Toggle -->
<button class="w-14 h-14 rounded-full border border-white/20 flex items-center justify-center bg-white/5 hover:bg-white/10 transition-all group" id="toggleCam" onclick="toggleControl('toggleCam', 'videocam', 'videocam_off')">

</button>
<!-- Screen Share -->

</button>

<span class="material-symbols-outlined text-white fill-icon group-active:rotate-45 transition-transform">call_end</span>
</button>

<!-- Side Overlay: Chat Drawer (Hidden by default) -->
<aside class="fixed top-0 right-0 h-full w-[350px] bg-surface-white border-l border-outline/20 translate-x-full transition-transform duration-500 z-[60]" id="chatDrawer">

</div>
<div class="flex-1 space-y-lg overflow-y-auto pr-sm custom-scrollbar">
<!-- Message -->
<div class="flex flex-col items-start max-w-[85%]">
<span class="font-label-sm text-label-sm text-ink-muted mb-xs">คุณอาร์ม</span>

            สวัสดีทุกคน เห็นหน้าจอที่แชร์ไหมครับ?
          </div>
</div>
<!-- My Message -->
<div class="flex flex-col items-end w-full">
<div class="bg-secondary-container p-md rounded-tl-lg rounded-br-lg rounded-bl-lg text-on-secondary-container font-body-md text-body-md border border-secondary/10">
            เห็นชัดเจนครับ สวยมาก!
          </div>
</div>
</div>
<div class="mt-auto pt-xl">
<div class="relative">
<input class="w-full h-[50px] rounded-full border border-ink bg-white px-xl font-body-md focus:ring-2 focus:ring-primary-container outline-none transition-all" placeholder="พิมพ์ข้อความที่นี่..." type="text"/>
<button class="absolute right-xs top-xs w-10 h-10 rounded-full bg-primary-container flex items-center justify-center border border-ink text-ink">
<span class="material-symbols-outlined text-md">send</span>
</button>
</div>
</div>
</div>
</aside>
<script>
    function toggleControl(btnId, iconOn, iconOff) {
      const btn = document.getElementById(btnId);
      const icon = btn.querySelector('.material-symbols-outlined');
      const isOn = icon.textContent === iconOn;
      
      if (isOn) {
        icon.textContent = iconOff;
        btn.classList.remove('bg-white/5');
        btn.classList.add('bg-error/20', 'border-error/50');
        icon.classList.add('text-error');
      } else {
        icon.textContent = iconOn;
        btn.classList.remove('bg-error/20', 'border-error/50');
        btn.classList.add('bg-white/5');
        icon.classList.remove('text-error');
        icon.classList.add('text-white');
      }
    }

    function toggleChat() {
      const drawer = document.getElementById('chatDrawer');
      drawer.classList.toggle('translate-x-full');
    }

    // Connect Chat Badge to Open Chat
    document.querySelector('button[onclick*="chat"]').addEventListener('click', toggleChat);

    // Subtle breathing animation for active speaker
    const activeSpeaker = document.querySelector('.video-grid div:first-child');
    if(activeSpeaker) {
        activeSpeaker.classList.add('border-primary-container', 'border-2');
    }
  </script>
