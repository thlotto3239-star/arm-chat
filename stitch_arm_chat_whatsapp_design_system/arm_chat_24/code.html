<!-- Micro-interaction Script -->
<script>
        let isZoomed = false;
        const uiElements = document.querySelectorAll('.ui-fade-in');
        let uiVisible = true;
        let hideTimeout;

        function toggleZoom(img) {
            isZoomed = !isZoomed;
            if (isZoomed) {
                img.style.transform = 'scale(1.5)';
                img.classList.remove('cursor-zoom-in');
                img.classList.add('cursor-zoom-out');
                hideUI();
            } else {
                img.style.transform = 'scale(1)';
                img.classList.remove('cursor-zoom-out');
                img.classList.add('cursor-zoom-in');
                showUI();
            }
        }

        function showUI() {
            uiElements.forEach(el => {
                el.style.opacity = '1';
                el.style.pointerEvents = 'auto';
            });
            uiVisible = true;
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(hideUI, 4000);
        }

        function hideUI() {
            if (isZoomed) return; // Optional: keep UI hidden when zoomed
            uiElements.forEach(el => {
                el.style.opacity = '0';
                el.style.pointerEvents = 'none';
            });
            uiVisible = false;
        }

        // Interaction to show UI on mouse move or tap
        document.addEventListener('mousemove', () => {
            if (!uiVisible) showUI();
        });

        document.addEventListener('touchstart', () => {
            if (!uiVisible) showUI();
        });

        // Initialize auto-hide
        hideTimeout = setTimeout(hideUI, 3000);

        // Simple ESC key to close
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (isZoomed) toggleZoom(document.getElementById('main-image'));
                else console.log('Exit Preview');
            }
        });
    </script>
