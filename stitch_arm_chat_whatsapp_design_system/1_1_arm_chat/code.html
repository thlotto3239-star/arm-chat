<button class="w-12 h-12 rounded-full border border-white/30 flex items-center justify-center text-white hover:bg-white/10 active:scale-90 transition-all">

<div class="flex items-center justify-center space-x-lg px-xl py-sm bg-white/10 backdrop-blur-xl rounded-full border border-white/20">
<!-- Toggle Camera -->
<button class="group flex flex-col items-center space-y-1 px-md py-xs rounded-full transition-all duration-200" onclick="toggleActive(this)">
<div class="w-14 h-14 rounded-full flex items-center justify-center bg-white/20 group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-white text-[28px]">videocam</span>
</div>
</button>
<!-- Mute Microphone -->
<button class="group flex flex-col items-center space-y-1 px-md py-xs rounded-full transition-all duration-200" onclick="toggleActive(this)">
<div class="w-14 h-14 rounded-full flex items-center justify-center bg-white/20 group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-white text-[28px]">mic</span>
</div>
</button>
<!-- End Call Button -->

<div class="w-16 h-16 rounded-full flex items-center justify-center bg-error shadow-lg shadow-error/30 active:scale-90 transition-all">
<span class="material-symbols-outlined text-white text-[32px]">call_end</span>
</div>
</button>
</div>
</div>
</div>
<!-- Interactive Layer / Micro-interactions -->
<script>
        function toggleActive(btn) {
            const iconContainer = btn.querySelector('div');
            const icon = btn.querySelector('span');
            
            if (iconContainer.classList.contains('bg-white')) {
                // Return to inactive state
                iconContainer.classList.remove('bg-white');
                iconContainer.classList.add('bg-white/20');
                icon.classList.remove('text-surface-dark');
                icon.classList.add('text-white');
                
                // If it was a mute button, update icon
                if (icon.innerText === 'mic_off') icon.innerText = 'mic';
                if (icon.innerText === 'videocam_off') icon.innerText = 'videocam';
            } else {
                // Set to active/muted state
                iconContainer.classList.remove('bg-white/20');
                iconContainer.classList.add('bg-white');
                icon.classList.remove('text-white');
                icon.classList.add('text-surface-dark');

                // If it was a mute button, update icon
                if (icon.innerText === 'mic') icon.innerText = 'mic_off';
                if (icon.innerText === 'videocam') icon.innerText = 'videocam_off';
            }
        }

        // Simple timer logic
        let seconds = 252; // Start at 04:12
        const timerElement = document.getElementById('call-timer');
        
        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerElement.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
    </script>
