<!DOCTYPE html>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        .scan-frame-corner {
            width: 40px;
            height: 40px;
            border-color: #25d366;
            position: absolute;
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #25d366, transparent);
            box-shadow: 0 0 15px #25d366;
            position: absolute;
            width: 100%;
            top: 0;
            animation: scanMove 3s infinite linear;
        }
        @keyframes scanMove {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>

<body class="bg-surface text-ink font-body-md overflow-hidden">
<!-- Header (TopNavBar Variant for Task Focus) -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-xl h-20 bg-transparent">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-white/20 backdrop-blur-md border border-white/30 text-white" onclick="window.history.back()">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display-md text-body-lg text-white">สแกนรหัส QR</h1>
<div class="flex gap-md">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-white/20 backdrop-blur-md border border-white/30 text-white">
<span class="material-symbols-outlined" data-icon="flashlight_on">flashlight_on</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-white/20 backdrop-blur-md border border-white/30 text-white">
<span class="material-symbols-outlined" data-icon="photo_library">photo_library</span>
</button>
</div>
</header>
<!-- Camera Viewport Container -->
<main class="relative w-full h-screen bg-black">
<!-- Mock Camera Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center opacity-60" data-alt="A blurred high-resolution background of a modern coffee shop interior in Bangkok. The scene features warm ambient lighting with bokeh effects from pendant lights. A wooden table is slightly visible in the foreground. The aesthetic is clean, professional, and slightly desaturated to mimic a high-quality smartphone camera viewfinder in a light-mode interface." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBWK_eGN2wzoTaD3OOvf0smM5Io4Y91uBmVS-W9Yo08kiQyBcG9QHqb-Sm6ZrQZSrMSBMUMcYcK6kxkQ2esHrI9S01ucczQtaZYonNTiKDgXZV-j9wX4xxXGMDPKsR2AhY1GkIbnpgfGTbWpdwT1bIjc3FHa4Rh3tSwijOiIw0EqtrzmXH_0fmuuW96i_8A09J4IEk40kSul1bhktrqn6pvdmBaD6mGxy94xSCTUSm20RgKA5DSA40')"></div>
</div>
<!-- Scanning Overlay Interface -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center">
<!-- Instructions -->
<div class="mb-huge text-center px-xl">
<p class="text-white font-body-md drop-shadow-md">จัดรหัส QR ให้อยู่ในกรอบเพื่อเริ่มสแกน</p>
</div>
<!-- Scan Frame Area -->
<div class="relative w-[280px] h-[280px] md:w-[320px] md:h-[320px]">
<!-- Corners -->
<div class="scan-frame-corner top-0 left-0 border-t-4 border-l-4 rounded-tl-xl"></div>
<div class="scan-frame-corner top-0 right-0 border-t-4 border-r-4 rounded-tr-xl"></div>
<div class="scan-frame-corner bottom-0 left-0 border-b-4 border-l-4 rounded-bl-xl"></div>
<div class="scan-frame-corner bottom-0 right-0 border-b-4 border-r-4 rounded-br-xl"></div>
<!-- Scanning Line -->
<div class="scan-line"></div>
<!-- Central Visual Guide -->
<div class="absolute inset-0 flex items-center justify-center opacity-20">
<span class="material-symbols-outlined text-[120px] text-white" data-icon="qr_code_scanner">qr_code_scanner</span>
</div>
</div>
<!-- Bottom Actions -->
<div class="mt-huge flex flex-col items-center gap-xl w-full px-xl max-w-md">
<button class="w-full py-md px-xl bg-primary-container text-on-primary-container rounded-full border border-ink font-button-md text-button-md flex items-center justify-center gap-md transition-transform active:scale-95 shadow-lg">
<span class="material-symbols-outlined" data-icon="qr_code_2">qr_code_2</span>
                    แสดงรหัส QR ของฉัน
                </button>
<div class="flex items-center gap-md text-white/80 font-label-sm">
<span class="h-px w-8 bg-white/30"></span>
<span>เพิ่มเพื่อนได้ง่ายและรวดเร็ว</span>
<span class="h-px w-8 bg-white/30"></span>
</div>
</div>
</div>
<!-- Atmospheric Effect (Dust/Particles script-based overlay) -->
<div class="absolute inset-0 pointer-events-none opacity-30 z-0" id="particle-container"></div>
</main>
<!-- Footer Identity (Mini) -->
<div class="fixed bottom-xl left-0 right-0 z-50 text-center pointer-events-none">
<span class="font-display-md text-sm text-white/50 tracking-widest">ARM CHAT SECURE</span>
</div>
<script>
        // Simple Micro-interaction for the Scanning Animation and Particles
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particle-container');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'absolute bg-white rounded-full';
                const size = Math.random() * 2 + 1;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}%`;
                p.style.top = `${Math.random() * 100}%`;
                p.style.opacity = Math.random() * 0.5;
                container.appendChild(p);
                
                animateParticle(p);
            }
        });

        function animateParticle(el) {
            const duration = 10000 + Math.random() * 20000;
            const targetY = -100;
            const startY = parseFloat(el.style.top);
            
            el.animate([
                { transform: `translateY(0px)`, opacity: el.style.opacity },
                { transform: `translateY(${targetY}px)`, opacity: 0 }
            ], {
                duration: duration,
                iterations: Infinity,
                easing: 'linear'
            });
        }
    </script>
