name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest

    env:
      # Mock env values for CI build. Real secrets via GitHub Secrets when needed.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder_publishable_key
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
      NEXT_PUBLIC_LIVEKIT_URL: wss://placeholder.livekit.cloud
      LIVEKIT_API_KEY: placeholder_livekit_api_key
      LIVEKIT_API_SECRET: placeholder_livekit_api_secret
      NEXT_PUBLIC_ONESIGNAL_APP_ID: placeholder_onesignal_app_id
      ONESIGNAL_REST_API_KEY: placeholder_onesignal_rest_api_key
      NEXT_PUBLIC_APP_URL: https://placeholder.arm-chat.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Secret scan in src/
        run: |
          if grep -rE "APIhhdde4rPsfw8|Y4Wt9DLA4F4eqeeuRPvO|sb_publishable_XCIbzfYVnVP68LQovDGEBw|haxzbmlgbumziefqowok|GOCSPX-|os_v2_app_4s52epl5fjcrxilkz3f3hgvxjcpja74|WithunArmUxui|arm-chat-5yhlpr7r|e4bba23d-7d2a-451b-a16a-cecbb39ab748" src/; then
            echo "ERROR: hardcoded secret detected in src/"
            exit 1
          else
            echo "OK: no hardcoded secrets in src/"
          fi